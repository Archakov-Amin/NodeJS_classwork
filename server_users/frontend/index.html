<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление пользователями</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1>Управление пользователями</h1>

    <!-- Форма создания / редактирования -->
    <div class="form-card">
      <h2 id="form-title">Регистрация пользователя</h2>
      <form id="user-form" enctype="multipart/form-data">
        <input type="hidden" id="user-id">

        <div class="form-group">
          <label for="name">Имя:</label>
          <input type="text" id="name" required placeholder="Иван">
        </div>

        <div class="form-group">
          <label for="lastName">Фамилия:</label>
          <input type="text" id="lastName" required placeholder="Иванов">
        </div>

        <div class="form-group">
          <label for="age">Возраст (от 12 лет):</label>
          <input type="number" id="age" min="12" required placeholder="25">
        </div>

        <div class="form-group">
          <label for="avatar">Аватар:</label>
          <input type="file" id="avatar" accept="image/*">
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Сохранить</button>
          <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Отмена</button>
        </div>
      </form>
    </div>

    <!-- Список пользователей -->
    <h2>Список пользователей</h2>
    <div id="users-list" class="users-grid">
      <!-- Сюда JavaScript будет вставлять карточки -->
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
