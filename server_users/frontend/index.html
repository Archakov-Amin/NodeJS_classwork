<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">Users App</div>
    <nav id="nav" class="nav-links"></nav>
  </header>

  <main>
    <!-- Секция авторизации -->
    <section id="auth-section" class="view auth-page">
      <div class="auth-card">
        <h1 id="auth-title">Регистрация</h1>
        <div id="auth-error" class="error" hidden></div>

        <!-- Форма ВХОДА -->
        <form id="login-form" class="auth-form" hidden novalidate>
          <input name="email" type="email" placeholder="Email" required />
          <input name="password" type="password" placeholder="Пароль" required />
          <button type="submit">Войти</button>
          <p class="switch-link">
            Нет аккаунта? <a href="#" id="to-register">Зарегистрироваться</a>
          </p>
        </form>

        <!-- Форма РЕГИСТРАЦИИ -->
        <form id="register-form" class="auth-form">
          <div class="avatar-upload">
            <img id="avatar-preview" class="avatar" alt="" hidden />
            <div id="avatar-placeholder" class="avatar placeholder">?</div>
            <label class="file-label">
              Загрузить аватар
              <input type="file" id="avatar-input" accept="image/*" hidden />
            </label>
          </div>

          <input name="name" placeholder="Имя" required />
          <input name="lastName" placeholder="Фамилия" required />
          <input name="age" type="number" min="12" placeholder="Возраст" required />
          <input name="email" type="email" placeholder="Email" required />
          <input name="password" type="password" minlength="6"
                 placeholder="Пароль (мин. 6 символов)" required />

          <button type="submit">Зарегистрироваться</button>
          <p class="switch-link">
            Уже есть аккаунт? <a href="#" id="to-login">Войти</a>
          </p>
        </form>
      </div>
    </section>

    <!-- Секция ПРОФИЛЯ -->
    <section id="profile-section" class="view" hidden>
      <div class="profile-card">
        <div id="profile-avatar-wrap"></div>
        <h1 id="profile-name"></h1>
        <p class="email" id="profile-email"></p>
        <p id="profile-age"></p>

        <div id="profile-error" class="error" hidden></div>

        <div class="actions" id="profile-actions">
          <button id="edit-profile-btn">Редактировать</button>
          <button class="danger" id="delete-profile-btn">Удалить аккаунт</button>
        </div>

        <form id="edit-profile-form" class="edit-form" hidden>
          <input name="name" placeholder="Имя" required />
          <input name="lastName" placeholder="Фамилия" required />
          <input name="age" type="number" min="12" placeholder="Возраст" required />
          <div class="actions">
            <button type="submit">Сохранить</button>
            <button type="button" class="secondary" id="cancel-edit-btn">Отмена</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Секция ВСЕХ ПОЛЬЗОВАТЕЛЕЙ -->
    <section id="users-section" class="view" hidden>
      <h1>Все пользователи</h1>
      <div id="users-error" class="error" hidden></div>
      <div id="users-grid" class="users-grid"></div>
    </section>
  </main>

  <script src="registr.js"></script>
  <script src="profile.js"></script>
</body>
</html>
